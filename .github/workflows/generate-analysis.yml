name: Generate Analysis Outputs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'chore: generate analysis outputs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run credit risk analysis
        run: python python/bank_credit_risk_eda.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate analysis outputs"
          git push
